{% extends 'base.html' %}
{% block content %}
<div class="toolbar">
    <h1 style="margin:0;font-size:22px;font-weight:800;color:var(--text-main);">Audit Logs</h1>
</div>

<div class="card table-wrap">
    <table class="app-table">
        <thead>
            <tr>
                <th>User</th>
                <th>Action</th>
                <th>Target</th>
                <th>Time</th>
                <th>IP</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.user.name|default:'System' }}</td>
                <td style="font-weight:600;">{{ log.action }}</td>
                <td>{{ log.target }}</td>
                <td>{{ log.time }}</td>
                <td>{{ log.ip }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="5" class="panel-note">No audit logs available.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
